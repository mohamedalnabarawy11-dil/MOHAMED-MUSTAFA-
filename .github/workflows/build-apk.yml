name: Build Nabraawy Study APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure debug keystore exists for CI build
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Configure optional AI secret from GitHub Secrets
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -n "$OPENROUTER_KEY" ]; then
            echo "OPENROUTER_API_KEY=$OPENROUTER_KEY" > .env
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Copy APK with clean release name
        run: cp app/build/outputs/apk/debug/app-debug.apk Nabraawy-Study.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nabraawy-Study-APK
          path: Nabraawy-Study.apk

      - name: Publish Direct Download Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0 Nabraawy-Study.apk \
            --title "Nabraawy Study v1.0" \
            --notes "تطبيق نبراوي ستوديو للمذاكرة — اضغط على Nabraawy-Study.apk للتحميل المباشر والتثبيت." \
            --latest || gh release upload v1.0 Nabraawy-Study.apk --clobber
